[build]
  command = "pnpm --filter @workspace/lai-design run build"
  publish = "artifacts/lai-design/dist/public"

[build.environment]
  NODE_VERSION = "20"
  BASE_PATH = "/"
  PORT = "5173"

# SPA routing - serve index.html for all routes.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
